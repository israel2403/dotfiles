# fff configuration — the control center
# See: man fff

# Use the standalone opener script installed by the `scripts` stow package.
# fff is launched from interactive zsh, which does NOT export bash functions to
# subprocesses, so the previous function-name `fff_open` was invisible inside
# fff's own bash subprocess and FFF_OPENER silently did nothing. `fff-open` is
# a real executable on PATH and works regardless of which shell launched fff.
export FFF_OPENER="fff-open"

# Show hidden files by default
export FFF_HIDDEN=1

# Use trash-cli instead of permanent delete
export FFF_TRASH_CMD="trash-put"

# File format for new files (strftime)
export FFF_FILE_FORMAT="%f"

# Mark format
export FFF_MARK_FORMAT=" %f*"

# Colors (Nord-ish palette)
# directory / symlink / broken symlink / file / multi-select
export FFF_COL1=4  # blue — directories
export FFF_COL2=6  # cyan — symlinks
export FFF_COL3=1  # red — broken symlinks
export FFF_COL4=7  # white — files
export FFF_COL5=5  # magenta — multi-select

# cd on exit: fff changes dir in the shell when you quit
export FFF_CD_ON_EXIT=1
export FFF_CD_FILE=~/.fff_d

# Favorites (press 1-9 inside fff to jump)
export FFF_FAV1=~/projects
export FFF_FAV2=~/dotfiles
export FFF_FAV3=~/projects/school/master
export FFF_FAV4=~/.config
export FFF_FAV5=/tmp
export FFF_FAV6=~/projects/personal/java/java-21-certification
