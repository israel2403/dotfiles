# ~/.config/lazygit/config.yml -- managed via ~/dotfiles (GNU stow)
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#
# snacks.nvim's lazygit integration auto-generates a theme YAML that matches
# the active Neovim colorscheme and chains it via LG_CONFIG_FILE, so the GUI
# theming below is intentionally minimal -- snacks layers its theme on top
# every time you launch lazygit from inside nvim.

git:
  autoFetch: true # fetch from origin on open
  autoRefresh: true # refresh the UI when files change on disk
  pagers:
    - colorArg: always
      # NOTE: leaving `pager:` unset uses lazygit's built-in diff renderer.
      # If you ever install git-delta, uncomment this for richer diffs:
      #   pager: delta --paging=never --line-numbers
os:
  # When launched from inside nvim ($NVIM set), open files in the parent
  # nvim instead of a nested one. Outside nvim this falls back to plain
  # `nvim "$file"`. Script lives at scripts/.local/bin/lazygit-edit.
  edit: 'lazygit-edit "{{filename}}"'
  editAtLine: 'lazygit-edit "{{filename}}" "{{line}}"'
  editAtLineAndWait: 'lazygit-edit "{{filename}}" "{{line}}"'
  editInTerminal: true
gui:
  border: rounded
  showFileTree: true
  showCommandLog: false
  showRandomTip: false
  nerdFontsVersion: "3"
  scrollHeight: 3
  showBottomLine: true
  authorColors:
    "*": "yellow"
update:
  method: never # lazygit is managed by pacman; don't self-update
confirmOnQuit: false
disableStartupPopups: true
