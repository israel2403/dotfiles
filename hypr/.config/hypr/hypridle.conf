# ~/.config/hypr/hypridle.conf -- managed via ~/dotfiles (GNU stow)
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# All idle behaviour is pushed out so the screen never goes to sleep before
# 20 minutes (1200 s) of inactivity. The original Omarchy cascade is kept in
# the same order, just scaled to land at -20 min:
#
#     18 min (1080 s)  screensaver
#     19 min (1140 s)  loginctl lock-session
#     20 min (1200 s)  keyboard-backlight off
#     20 min (1200 s)  DPMS (screen) off
#
# Adjust the four timeouts below if you want a different idle profile -- the
# only constraint hypridle imposes is that timeouts are evaluated in order.

general {
    lock_cmd = omarchy-lock-screen                         # lock screen and 1password
    before_sleep_cmd = loginctl lock-session               # lock before suspend
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on  # delay for PAM, then turn the display back on
    inhibit_sleep = 3                                      # don't suspend until the screen is locked
}

# 1. Screensaver -- visible feedback that idle is approaching.
listener {
    timeout = 1080                                            # 18 min
    on-timeout = pidof hyprlock || omarchy-launch-screensaver # start screensaver if not already locked
}

# 2. Lock the session shortly after.
listener {
    timeout = 1140                     # 19 min
    on-timeout = loginctl lock-session # lock screen
}

# 3. Save power by killing the keyboard backlight at the same moment as DPMS.
listener {
    timeout = 1200                                           # 20 min
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0  # save state and turn off keyboard backlight
    on-resume = brightnessctl -rd '*::kbd_backlight'         # restore keyboard backlight
}

# 4. DPMS off -- the actual "screen goes to sleep" event.
listener {
    timeout = 1200                                           # 20 min
    on-timeout = hyprctl dispatch dpms off                   # screen off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on + restore brightness on activity
}
