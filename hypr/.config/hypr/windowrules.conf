# Personal Hyprland window rules.
# Sourced from ~/.config/hypr/hyprland.conf.
#
# Reference: https://wiki.hypr.land/Configuring/Window-Rules/
# `group set always` makes every matching window open as part of a group:
#   - If an unlocked group is focused, the new window joins it.
#   - If no group is focused, the new window becomes a new group head.
#   - The `always` qualifier keeps the rule active on every map (not just the first).
# This means qutebrowser windows restored after a reboot auto-merge into the
# same Hyprland tabbed group instead of opening as separate tiled windows.

# Auto-group all qutebrowser windows
windowrule = group set always, match:class ^(org\.qutebrowser\.qutebrowser)$
